version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - revive
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mikemadden42
